name: 3D Contributions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # tous les jours à 03:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # ⚠️ PAS de "with:" ici. Tout passe en variables d'environnement.
      - name: Generate 3D profile
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ github.token }}         # ou ${{ secrets.GITHUB_TOKEN }}
          USERNAME: brydel                          # ton user
          # (optionnel) MAX_REPOS: "100"
          # (optionnel) SETTING_JSON: ".github/3d-settings.json"

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib || true
          git commit -m "chore: update 3D contributions" || echo "no changes"
          git push
