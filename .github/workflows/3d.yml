name: 3D Contributions

on:
  schedule:
    - cron: "0 3 * * *"   # Tous les jours à 03h UTC
  workflow_dispatch:       # Permet de lancer à la main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D profile
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        with:
          user_name: brydel
          output_folder: profile-3d-contrib
          theme: night-rainbow

      - name: Commit files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/*
          git commit -m "update 3D profile" || echo "no changes"
          git push
